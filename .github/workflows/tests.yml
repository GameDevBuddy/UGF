name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gdscript-tests:
    name: GDScript tests (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ matrix.godot }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://downloads.godotengine.org/?version=${{ matrix.godot }}&flavor=stable&slug=linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v*_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        # The first run builds the .godot cache and registers global classes.
        # Without it, class_name lookups fail on a clean checkout.
        run: ~/godot-bin/godot --headless --path . --import

      - name: Run tests
        run: ~/godot-bin/godot --headless --path . --script tests/run_tests.gd

      - name: Fail on engine errors
        # The suite's own exit code covers assertions. This catches leaked
        # objects and script errors, which pass tests but should not ship.
        run: |
          output=$(~/godot-bin/godot --headless --path . --script tests/run_tests.gd 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "SCRIPT ERROR|leaked at exit|still in use at exit"; then
            echo "::error::Engine reported script errors or leaked objects."
            exit 1
          fi
